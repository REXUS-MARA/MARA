---
# deploy.yml — Run after copying the MARA binary to the Pi
# Sets capabilities on the binary and installs/enables the systemd service
# Usage: ansible-playbook -i inventory.ini deploy.yml [-e "mara_user=pi"]

- hosts: pi
  become: yes
  vars:
    mara_user: fsowa
    mara_dir: /home/{{ mara_user }}/mara
    mara_binary: "{{ mara_dir }}/MARA"
    mara_address: 0.0.0.0
    mara_port: 50000

  tasks:
    - name: Set RT scheduling capability on MARA binary
      community.general.capabilities:
        path: "{{ mara_binary }}"
        capability: cap_sys_nice+eip
        state: present

